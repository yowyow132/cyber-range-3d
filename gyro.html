<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CYBER RANGE 3D — 手機無線陀螺儀</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #060913; color: #e2e8f0;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }
    .app {
      display: flex; flex-direction: column; height: 100%; padding: 12px 14px; gap: 10px;
      max-width: 560px; margin: 0 auto;
    }
    .header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 12px; border-radius: 10px;
      background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(0, 255, 204, 0.3);
    }
    .title { font-size: 14px; font-weight: 800; color: #00ffcc; letter-spacing: 0.5px; }
    .ws-badge {
      font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
      background: rgba(239, 68, 68, 0.18); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4);
    }
    .ws-badge.ok {
      background: rgba(16, 185, 129, 0.18); color: #6ee7b7; border-color: rgba(16, 185, 129, 0.5);
    }
    .hud-strip {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
    }
    .hud-box {
      background: rgba(15, 23, 42, 0.78); border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 8px; padding: 8px 10px; text-align: center;
    }
    .hud-label { font-size: 11px; color: #94a3b8; }
    .hud-val { font-size: 18px; font-weight: 800; color: #38bdf8; margin-top: 2px; }
    .hud-val.hp { color: #34d399; }
    .hud-val.warn { color: #f87171; }
    .main-btn {
      width: 100%; padding: 15px 14px; border-radius: 12px; border: 1px solid #00ffcc;
      background: linear-gradient(135deg, rgba(0, 255, 204, 0.22), rgba(56, 189, 248, 0.18));
      color: #00ffcc; font-size: 17px; font-weight: 800; cursor: pointer;
      box-shadow: 0 0 18px rgba(0, 255, 204, 0.18);
    }
    .main-btn.active {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.35), rgba(6, 182, 212, 0.3));
      border-color: #34d399; color: #ecfdf5;
    }
    .panel {
      background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px;
    }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .seg-group { display: flex; gap: 6px; width: 100%; }
    .seg-btn {
      flex: 1; padding: 8px 4px; border-radius: 8px; font-size: 12px; font-weight: 700;
      background: rgba(30, 41, 59, 0.85); color: #cbd5e1; border: 1px solid rgba(148, 163, 184, 0.28);
    }
    .seg-btn.active {
      background: rgba(168, 85, 247, 0.28); color: #e9d5ff; border-color: #a855f7;
    }
    .slider-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #cbd5e1; }
    .slider-row input[type=range] { flex: 1; accent-color: #00ffcc; }
    .check-row { display: flex; gap: 16px; font-size: 13px; color: #cbd5e1; }
    .check-row label { display: flex; align-items: center; gap: 5px; }
    .telemetry {
      font-family: ui-monospace, monospace; font-size: 12px; color: #94a3b8;
      display: flex; justify-content: space-between;
    }
    .controls-area {
      flex: 1; min-height: 140px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding-top: 4px;
    }
    .joy-base {
      width: 132px; height: 132px; border-radius: 50%; position: relative;
      background: radial-gradient(circle, rgba(56,189,248,0.12), rgba(15,23,42,0.85));
      border: 2px solid rgba(56, 189, 248, 0.45);
      flex-shrink: 0;
    }
    .joy-knob {
      width: 52px; height: 52px; border-radius: 50%;
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      background: rgba(0, 255, 204, 0.45); border: 2px solid #00ffcc;
      pointer-events: none;
    }
    .action-grid {
      flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; height: 132px;
    }
    .act-btn {
      border-radius: 10px; border: 1px solid rgba(56, 189, 248, 0.45);
      background: rgba(30, 41, 59, 0.9); color: #e2e8f0; font-size: 14px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
    }
    .act-btn:active { background: rgba(0, 255, 204, 0.35); border-color: #00ffcc; }
    .act-btn.purple { border-color: rgba(168, 85, 247, 0.55); color: #e9d5ff; }
    .act-btn.amber { border-color: rgba(251, 191, 36, 0.55); color: #fde68a; }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="title">🎯 手機無線陀螺儀</div>
      <div id="ws-badge" class="ws-badge">連線中...</div>
    </div>

    <div class="hud-strip">
      <div class="hud-box">
        <div class="hud-label">彈藥</div>
        <div id="hud-ammo" class="hud-val">--/--</div>
      </div>
      <div class="hud-box">
        <div class="hud-label">HP</div>
        <div id="hud-hp" class="hud-val hp">--%</div>
      </div>
      <div class="hud-box">
        <div class="hud-label">狀態</div>
        <div id="hud-state" class="hud-val" style="font-size:14px; line-height:24px;">WAIT</div>
      </div>
    </div>

    <div style="display:flex; gap:8px;">
      <button id="toggle-gyro-btn" class="main-btn" style="flex:2;">🎯 啟動陀螺儀瞄準</button>
      <button id="cal-btn" class="main-btn" style="flex:1; font-size:14px; padding:12px 8px; border-color:#a855f7; color:#e9d5ff; background:rgba(168,85,247,0.22);">🧭 自動校正</button>
    </div>
    <div id="cal-banner" style="display:none; padding:10px 12px; border-radius:10px; background:rgba(168,85,247,0.25); border:1px solid #c084fc; color:#f3e8ff; font-size:14px; font-weight:700; text-align:center;"></div>

    <div class="panel">
      <div style="font-size:12px; color:#94a3b8; display:flex; justify-content:space-between;">
        <span>📱 手機固定方向</span>
        <span id="axis-badge" style="color:#00ffcc; font-family:monospace;">預設</span>
      </div>
      <div class="seg-group">
        <button class="seg-btn active" data-mount="portrait">豎放<br><span style="font-size:10px;opacity:0.75;">直拿朝人</span></button>
        <button class="seg-btn" data-mount="flat">平放<br><span style="font-size:10px;opacity:0.75;">螢幕朝天</span></button>
        <button class="seg-btn" data-mount="landscape">橫放<br><span style="font-size:10px;opacity:0.75;">橫拿朝人</span></button>
        <button class="seg-btn" data-mount="side">側放<br><span style="font-size:10px;opacity:0.75;">貼槍側面</span></button>
      </div>

      <div class="slider-row">
        <span>瞄準靈敏</span>
        <input id="sens-slider" type="range" min="0.5" max="6.0" step="0.2" value="2.8" />
        <span id="sens-val" style="min-width:36px; text-align:right; color:#00ffcc;">2.8x</span>
      </div>

      <div class="slider-row">
        <span>體感觸發</span>
        <input id="gesture-slider" type="range" min="0.6" max="1.6" step="0.1" value="1.0" />
        <span id="gesture-val" style="min-width:36px; text-align:right; color:#38bdf8;">1.0x</span>
      </div>

      <div class="row">
        <div class="check-row" style="gap:10px; font-size:12px;">
          <label><input type="checkbox" id="inv-x" /> 左右反轉</label>
          <label><input type="checkbox" id="inv-y" /> 上下反轉</label>
          <label><input type="checkbox" id="edge-en" checked /> 偏轉續轉</label>
          <label><input type="checkbox" id="gesture-en" checked /> 體感跳/衝</label>
        </div>
        <div id="sensor-mode" style="font-size:11px; color:#a855f7;">感測器: 待啟動</div>
      </div>

      <div class="telemetry">
        <span id="tel-delta">ΔYaw: 0.00 | ΔPitch: 0.00</span>
        <span id="gesture-badge" style="color:#facc15; font-weight:700;"></span>
        <span id="tel-rate">0 Hz</span>
      </div>
    </div>

    <div class="controls-area">
      <div id="joy-base" class="joy-base">
        <div id="joy-knob" class="joy-knob"></div>
      </div>
      <div class="action-grid" style="grid-template-rows: repeat(3, 1fr);">
        <button class="act-btn purple" data-cmd="TURN_180">🔄 回頭180°</button>
        <button id="clutch-btn" class="act-btn" style="border-color:#f43f5e; color:#fda4af;">⏸ 按住移正</button>
        <button class="act-btn" data-cmd="JUMP">🦘 跳躍</button>
        <button class="act-btn" data-cmd="DASH">⚡ 衝刺</button>
        <button class="act-btn amber" data-cmd="RELOAD">🔄 換彈</button>
        <button id="center-btn" class="act-btn">↺ 歸零中心</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/mqtt@5.16.1/dist/mqtt.min.js"></script>
  <script>
    const wsBadge = document.getElementById('ws-badge');
    const toggleBtn = document.getElementById('toggle-gyro-btn');
    const calBtn = document.getElementById('cal-btn');
    const calBanner = document.getElementById('cal-banner');
    const axisBadge = document.getElementById('axis-badge');
    const sensSlider = document.getElementById('sens-slider');
    const sensVal = document.getElementById('sens-val');
    const gestureSlider = document.getElementById('gesture-slider');
    const gestureVal = document.getElementById('gesture-val');
    const gestureEnEl = document.getElementById('gesture-en');
    const edgeEnEl = document.getElementById('edge-en');
    const clutchBtn = document.getElementById('clutch-btn');
    const gestureBadgeEl = document.getElementById('gesture-badge');
    const invXEl = document.getElementById('inv-x');
    const invYEl = document.getElementById('inv-y');
    const sensorModeEl = document.getElementById('sensor-mode');
    const telDeltaEl = document.getElementById('tel-delta');
    const telRateEl = document.getElementById('tel-rate');
    const hudAmmoEl = document.getElementById('hud-ammo');
    const hudHpEl = document.getElementById('hud-hp');
    const hudStateEl = document.getElementById('hud-state');

    let ws = null;
    let gyroActive = false;
    let isClutchHeld = false;
    let virtualYaw = 0;
    let mountMode = localStorage.getItem('gyro_mount') || 'portrait';
    let customMap = null;
    try {
      const savedMap = localStorage.getItem('gyro_custom_map');
      if (savedMap) customMap = JSON.parse(savedMap);
    } catch (e) {}
    let sensitivity = parseFloat(localStorage.getItem('gyro_sens_v2') || '2.8');
    let gestureSens = parseFloat(localStorage.getItem('gyro_gesture_sens') || '1.0');
    let gestureEnabled = localStorage.getItem('gyro_gesture_en') !== '0';
    let edgeTurnEnabled = localStorage.getItem('gyro_edge_en') !== '0';
    let invX = localStorage.getItem('gyro_inv_x') === '1';
    let invY = localStorage.getItem('gyro_inv_y') === '1';
    let wakeLock = null;

    // 校正狀態機：0=無, 1=偵測往右轉(Yaw), 2=等待停頓, 3=偵測往上抬(Pitch)
    let calStage = 0;
    let calSum = { a: 0, b: 0, g: 0 };
    let calYaw = null;

    function updateAxisBadge() {
      if (mountMode === 'custom' && customMap) {
        const sy = customMap.yawSign > 0 ? '+' : '-';
        const sp = customMap.pitchSign > 0 ? '+' : '-';
        axisBadge.textContent = `已校正 (${sy}${customMap.yawAxis.toUpperCase()} / ${sp}${customMap.pitchAxis.toUpperCase()})`;
      } else {
        axisBadge.textContent = `預設: ${mountMode}`;
      }
      document.querySelectorAll('.seg-btn').forEach(b => b.classList.toggle('active', b.dataset.mount === mountMode));
    }

    sensSlider.value = sensitivity;
    sensVal.textContent = `${sensitivity.toFixed(1)}x`;
    gestureSlider.value = gestureSens;
    gestureVal.textContent = `${gestureSens.toFixed(1)}x`;
    gestureEnEl.checked = gestureEnabled;
    edgeEnEl.checked = edgeTurnEnabled;
    invXEl.checked = invX;
    invYEl.checked = invY;
    updateAxisBadge();
    document.querySelectorAll('.seg-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        mountMode = btn.dataset.mount;
        localStorage.setItem('gyro_mount', mountMode);
        updateAxisBadge();
      });
    });

    sensSlider.addEventListener('input', () => {
      sensitivity = parseFloat(sensSlider.value);
      localStorage.setItem('gyro_sens_v2', sensitivity);
      sensVal.textContent = `${sensitivity.toFixed(1)}x`;
    });
    gestureSlider.addEventListener('input', () => {
      gestureSens = parseFloat(gestureSlider.value);
      localStorage.setItem('gyro_gesture_sens', gestureSens);
      gestureVal.textContent = `${gestureSens.toFixed(1)}x`;
    });
    gestureEnEl.addEventListener('change', () => {
      gestureEnabled = gestureEnEl.checked;
      localStorage.setItem('gyro_gesture_en', gestureEnabled ? '1' : '0');
    });
    edgeEnEl.addEventListener('change', () => {
      edgeTurnEnabled = edgeEnEl.checked;
      localStorage.setItem('gyro_edge_en', edgeTurnEnabled ? '1' : '0');
      virtualYaw = 0;
    });
    invXEl.addEventListener('change', () => {
      invX = invXEl.checked;
      localStorage.setItem('gyro_inv_x', invX ? '1' : '0');
    });
    invYEl.addEventListener('change', () => {
      invY = invYEl.checked;
      localStorage.setItem('gyro_inv_y', invY ? '1' : '0');
    });

    // --- 1. 連線引擎（有 ?room= 走雲端 MQTT over WSS，否則走本機 WebSocket 中繼）---
    const targetRoomId = new URLSearchParams(location.search).get('room') || new URLSearchParams(location.search).get('peer');
    let mqttClient = null;

    function handleIncomingSync(raw) {
      const lines = String(raw || '').split(/\r?\n/);
      for (const line of lines) {
        if (line.startsWith('S:')) {
          const p = line.slice(2).split(',');
          if (p.length >= 3) {
            const ammo = parseInt(p[0], 10) || 0;
            const hp = parseInt(p[1], 10) || 0;
            const st = p[2] || 'PLAY';
            const maxA = parseInt(p[3], 10) || ammo;
            hudAmmoEl.textContent = `${ammo}/${maxA}`;
            hudHpEl.textContent = `${hp}%`;
            hudHpEl.classList.toggle('warn', hp <= 30);
            hudStateEl.textContent = st;
          }
        }
      }
    }

    function connectMqtt(roomId) {
      if (typeof mqtt === 'undefined') {
        wsBadge.textContent = 'MQTT 載入失敗';
        return;
      }
      wsBadge.textContent = '雲端配對中...';
      wsBadge.classList.remove('ok');

      mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
        clientId: 'ph_' + roomId + '_' + Math.random().toString(36).slice(2, 6),
        clean: true,
        connectTimeout: 8000,
        reconnectPeriod: 1500,
        will: {
          topic: `cyberrange3d/${roomId}/tx`,
          payload: 'GYRO_STATUS:disconnected:0\n',
          qos: 0,
          retain: false
        }
      });

      mqttClient.on('connect', () => {
        mqttClient.subscribe(`cyberrange3d/${roomId}/rx`);
        mqttClient.publish(`cyberrange3d/${roomId}/tx`, 'GYRO_STATUS:connected:1\n');
        wsBadge.textContent = '已連線電腦';
        wsBadge.classList.add('ok');
      });

      mqttClient.on('message', (topic, payload) => {
        handleIncomingSync(payload ? payload.toString() : '');
      });

      mqttClient.on('reconnect', () => {
        wsBadge.textContent = '重連中...';
        wsBadge.classList.remove('ok');
      });

      mqttClient.on('offline', () => {
        wsBadge.textContent = '連線中斷';
        wsBadge.classList.remove('ok');
      });

      mqttClient.on('error', () => {
        wsBadge.textContent = '連線重試中';
        wsBadge.classList.remove('ok');
      });
    }

    function connectWS() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${proto}//${location.host}/ws?role=gyro`);
      wsBadge.textContent = '連線中...';
      wsBadge.classList.remove('ok');

      ws.onopen = () => {
        wsBadge.textContent = '已連線電腦';
        wsBadge.classList.add('ok');
      };
      ws.onmessage = (ev) => handleIncomingSync(ev.data);
      ws.onclose = () => {
        wsBadge.textContent = '斷線重連中';
        wsBadge.classList.remove('ok');
        setTimeout(connectWS, 1200);
      };
      ws.onerror = () => {
        try { ws.close(); } catch (e) {}
      };
    }

    if (targetRoomId) {
      connectMqtt(targetRoomId);
    } else {
      connectWS();
    }

    function sendCmd(msg) {
      const payload = msg.endsWith('\n') ? msg : (msg + '\n');
      if (targetRoomId && mqttClient && mqttClient.connected) {
        try { mqttClient.publish(`cyberrange3d/${targetRoomId}/tx`, payload); } catch (e) {}
      } else if (ws && ws.readyState === 1) {
        ws.send(payload);
      }
    }

    // --- 2. 陀螺儀感測讀取（優先 DeviceMotion rotationRate，無則退回 DeviceOrientation）---
    let pendingDx = 0;
    let pendingDy = 0;
    let lastMotionTs = 0;
    let gotRotationRate = false;
    let motionStartTs = 0;
    let lastOrient = null;
    let pktCount = 0;
    let lastRateTs = performance.now();

    function wrapAngleDelta(diff) {
      while (diff > 180) diff -= 360;
      while (diff < -180) diff += 360;
      return diff;
    }

    function processGyroDelta(da, db, dg) {
      // 校正模式：累積三軸角度變化來自動偵測方向與正負號
      if (calStage === 1 || calStage === 3) {
        calSum.a += da;
        calSum.b += db;
        calSum.g += dg;
        const absA = Math.abs(calSum.a);
        const absB = Math.abs(calSum.b);
        const absG = Math.abs(calSum.g);
        telDeltaEl.textContent = `α:${calSum.a.toFixed(1)}° β:${calSum.b.toFixed(1)}° γ:${calSum.g.toFixed(1)}°`;

        if (calStage === 1) {
          const maxVal = Math.max(absA, absB, absG);
          if (maxVal >= 14) {
            const yawAxis = absA >= absB && absA >= absG ? 'a' : (absB >= absG ? 'b' : 'g');
            // 往右轉要求 dx > 0
            const yawSign = calSum[yawAxis] >= 0 ? 1 : -1;
            calYaw = { yawAxis, yawSign };
            calStage = 2;
            calBanner.textContent = '✅ 已偵測左右軸！請停一下，準備往上抬槍...';
            setTimeout(() => {
              if (calStage === 2) {
                calSum = { a: 0, b: 0, g: 0 };
                calStage = 3;
                calBanner.textContent = '步驟 2/2：請把槍口【往上抬】約 30 度！';
              }
            }, 600);
          }
        } else if (calStage === 3 && calYaw) {
          const cand = ['a', 'b', 'g'].filter(k => k !== calYaw.yawAxis);
          const v0 = Math.abs(calSum[cand[0]]);
          const v1 = Math.abs(calSum[cand[1]]);
          if (Math.max(v0, v1) >= 12) {
            const pitchAxis = v0 >= v1 ? cand[0] : cand[1];
            // 往上抬要求 dy < 0 (因 camera.rotation.x -= dy * sens)
            const pitchSign = calSum[pitchAxis] >= 0 ? -1 : 1;
            customMap = {
              yawAxis: calYaw.yawAxis,
              yawSign: calYaw.yawSign,
              pitchAxis,
              pitchSign,
            };
            mountMode = 'custom';
            localStorage.setItem('gyro_mount', 'custom');
            localStorage.setItem('gyro_custom_map', JSON.stringify(customMap));
            calStage = 0;
            pendingDx = 0;
            pendingDy = 0;
            invX = false; invY = false;
            invXEl.checked = false; invYEl.checked = false;
            localStorage.setItem('gyro_inv_x', '0');
            localStorage.setItem('gyro_inv_y', '0');
            updateAxisBadge();
            calBanner.textContent = '🎉 校正完成！已自動鎖定最佳軸向，可直接開玩！';
            setTimeout(() => { if (calStage === 0) calBanner.style.display = 'none'; }, 2500);
          }
        }
        return;
      }
      if (calStage === 2) return;

      const vals = { a: da, b: db, g: dg };
      let dx = 0;
      let dy = 0;

      if (mountMode === 'custom' && customMap) {
        dx = vals[customMap.yawAxis] * customMap.yawSign;
        dy = vals[customMap.pitchAxis] * customMap.pitchSign;
      } else if (mountMode === 'portrait') {
        dx = -dg;
        dy = -db;
      } else if (mountMode === 'flat') {
        dx = -da;
        dy = -db;
      } else if (mountMode === 'landscape') {
        dx = -db;
        dy = dg;
      } else {
        // side：貼槍側面
        dx = -db;
        dy = da;
      }

      if (invX) dx = -dx;
      if (invY) dy = -dy;
      if (isClutchHeld) return;

      virtualYaw = Math.max(-55, Math.min(55, virtualYaw + dx));
      pendingDx += dx * sensitivity;
      pendingDy += dy * sensitivity;
    }

    // --- 2.5 體感跳躍（快速上抬）與衝刺（快速往前推）---
    let gravVec = { x: 0, y: 0, z: 9.81 };
    let gravInit = false;
    let lastGestureJumpMs = 0;
    let lastGestureDashMs = 0;
    let lastGestureAnyMs = 0;
    let lastDownSpikeMs = 0;
    let gestureBadgeTimer = null;

    function showGestureBadge(label) {
      gestureBadgeEl.textContent = label;
      if (gestureBadgeTimer) clearTimeout(gestureBadgeTimer);
      gestureBadgeTimer = setTimeout(() => { gestureBadgeEl.textContent = ''; }, 900);
      if (navigator.vibrate) { try { navigator.vibrate(35); } catch (e) {} }
    }

    function detectMotionGestures(ev, now, rotMag) {
      if (!gestureEnabled || calStage !== 0 || now - motionStartTs < 500) return;
      const ag = ev.accelerationIncludingGravity;
      if (!ag || ag.x === null || ag.y === null || ag.z === null) return;

      const gxRaw = ag.x || 0;
      const gyRaw = ag.y || 0;
      const gzRaw = ag.z || 0;

      if (!gravInit) {
        gravVec = { x: gxRaw, y: gyRaw, z: gzRaw };
        gravInit = true;
        return;
      }

      // 低通濾波追蹤世界垂直向上向量（重力反方向）
      gravVec.x = gravVec.x * 0.88 + gxRaw * 0.12;
      gravVec.y = gravVec.y * 0.88 + gyRaw * 0.12;
      gravVec.z = gravVec.z * 0.88 + gzRaw * 0.12;

      const gLen = Math.hypot(gravVec.x, gravVec.y, gravVec.z);
      if (gLen < 2.5) return;
      const ux = gravVec.x / gLen;
      const uy = gravVec.y / gLen;
      const uz = gravVec.z / gLen;

      // 優先取去重力線性加速度，無則以高通差值備援
      const acc = ev.acceleration;
      const ax = (acc && acc.x !== null) ? acc.x : (gxRaw - gravVec.x);
      const ay = (acc && acc.y !== null) ? acc.y : (gyRaw - gravVec.y);
      const az = (acc && acc.z !== null) ? acc.z : (gzRaw - gravVec.z);

      // 分解為「世界垂直方向 aUp」與「水平方向 aHoriz」
      const aUp = ax * ux + ay * uy + az * uz;
      const hx = ax - aUp * ux;
      const hy = ay - aUp * uy;
      const hz = az - aUp * uz;
      const aHoriz = Math.hypot(hx, hy, hz);

      if (aUp < -8.5) lastDownSpikeMs = now;

      const jumpThresh = 9.0 / gestureSens;
      const dashThresh = 10.0 / gestureSens;

      if (now - lastGestureAnyMs < 320) return;

      // 1. 快速上抬 -> 跳躍 JUMP（避免往下放時的回彈誤觸）
      if (
        aUp >= jumpThresh &&
        aUp > aHoriz * 0.85 &&
        now - lastDownSpikeMs > 220 &&
        now - lastGestureJumpMs > 700
      ) {
        lastGestureJumpMs = now;
        lastGestureAnyMs = now;
        sendCmd('JUMP');
        showGestureBadge('🦘 體感跳躍!');
        return;
      }

      // 2. 快速往前推 -> 衝刺 DASH（排除急速轉身造成的離心力）
      if (
        aHoriz >= dashThresh &&
        Math.abs(aUp) < aHoriz * 0.78 &&
        rotMag < 200 &&
        now - lastGestureDashMs > 850
      ) {
        lastGestureDashMs = now;
        lastGestureAnyMs = now;
        sendCmd('DASH');
        showGestureBadge('⚡ 體感衝刺!');
      }
    }

    function onDeviceMotion(ev) {
      if (!gyroActive) return;
      const rr = ev.rotationRate;
      if (!rr || (rr.alpha === null && rr.beta === null && rr.gamma === null)) return;

      gotRotationRate = true;
      sensorModeEl.textContent = '感測器: 角速度 (6軸)';

      const now = performance.now();
      const dt = lastMotionTs ? Math.min(0.06, (now - lastMotionTs) / 1000) : 0.016;
      lastMotionTs = now;

      const rawA = rr.alpha || 0;
      const rawB = rr.beta || 0;
      const rawG = rr.gamma || 0;
      const rotMag = Math.hypot(rawA, rawB, rawG);

      detectMotionGestures(ev, now, rotMag);

      const a = Math.abs(rawA) < 1.8 ? 0 : rawA;
      const b = Math.abs(rawB) < 1.8 ? 0 : rawB;
      const g = Math.abs(rawG) < 1.8 ? 0 : rawG;

      processGyroDelta(a * dt, b * dt, g * dt);
    }

    function onDeviceOrientation(ev) {
      if (!gyroActive) return;
      if (gotRotationRate) return;
      if (performance.now() - motionStartTs < 600) return;

      if (ev.alpha === null || ev.beta === null || ev.gamma === null) return;
      sensorModeEl.textContent = '感測器: 歐拉角 (備援)';

      if (!lastOrient) {
        lastOrient = { a: ev.alpha, b: ev.beta, g: ev.gamma };
        return;
      }

      const da = wrapAngleDelta(ev.alpha - lastOrient.a);
      const db = wrapAngleDelta(ev.beta - lastOrient.b);
      const dg = wrapAngleDelta(ev.gamma - lastOrient.g);
      lastOrient = { a: ev.alpha, b: ev.beta, g: ev.gamma };

      processGyroDelta(
        Math.abs(da) < 0.04 ? 0 : da,
        Math.abs(db) < 0.04 ? 0 : db,
        Math.abs(dg) < 0.04 ? 0 : dg
      );
    }

    // 平滑節流送出 AIM:dx,dy（含偏轉邊緣自動續轉）
    let lastAimSendMs = 0;
    function tickSendLoop() {
      const now = performance.now();
      const minInterval = targetRoomId ? 24 : 0;
      if (gyroActive && calStage === 0 && !isClutchHeld && (now - lastAimSendMs >= minInterval)) {
        let edgeDx = 0;
        if (edgeTurnEnabled && Math.abs(virtualYaw) > 20) {
          const excess = Math.min(35, Math.abs(virtualYaw) - 20);
          edgeDx = Math.sign(virtualYaw) * excess * (targetRoomId ? 0.21 : 0.14);
        }
        const totalDx = pendingDx + edgeDx;
        const totalDy = pendingDy;
        if (Math.abs(totalDx) > 0.005 || Math.abs(totalDy) > 0.005) {
          lastAimSendMs = now;
          pendingDx = 0;
          pendingDy = 0;
          sendCmd(`AIM:${totalDx.toFixed(3)},${totalDy.toFixed(3)}`);
          telDeltaEl.textContent = `偏角:${virtualYaw >= 0 ? '+' : ''}${virtualYaw.toFixed(0)}°${edgeDx !== 0 ? ' (續轉中)' : ''}`;
          pktCount++;
        }
      }
      if (now - lastRateTs >= 1000) {
        telRateEl.textContent = `${pktCount} Hz`;
        pktCount = 0;
        lastRateTs = now;
      }
      requestAnimationFrame(tickSendLoop);
    }
    requestAnimationFrame(tickSendLoop);

    async function requestSensorPermissions() {
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        const res = await DeviceMotionEvent.requestPermission();
        if (res !== 'granted') throw new Error('DeviceMotion 權限被拒絕');
      }
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        const res2 = await DeviceOrientationEvent.requestPermission();
        if (res2 !== 'granted') throw new Error('DeviceOrientation 權限被拒絕');
      }
    }

    async function startGyro() {
      if (!window.isSecureContext) {
        alert('請使用 https:// 開啟此頁面，瀏覽器才允許存取陀螺儀！');
        return false;
      }
      try {
        await requestSensorPermissions();
      } catch (err) {
        alert('無法取得手機陀螺儀權限：' + (err.message || err));
        return false;
      }

      gyroActive = true;
      gotRotationRate = false;
      gravInit = false;
      virtualYaw = 0;
      lastMotionTs = 0;
      lastOrient = null;
      pendingDx = 0;
      pendingDy = 0;
      motionStartTs = performance.now();

      window.addEventListener('devicemotion', onDeviceMotion);
      window.addEventListener('deviceorientation', onDeviceOrientation);

      toggleBtn.textContent = '🟢 陀螺儀瞄準運作中（點此暫停）';
      toggleBtn.classList.add('active');
      sensorModeEl.textContent = '感測器: 偵測中...';

      if ('wakeLock' in navigator) {
        try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
      }
      return true;
    }

    function stopGyro() {
      gyroActive = false;
      calStage = 0;
      calBanner.style.display = 'none';
      window.removeEventListener('devicemotion', onDeviceMotion);
      window.removeEventListener('deviceorientation', onDeviceOrientation);
      toggleBtn.textContent = '🎯 啟動陀螺儀瞄準';
      toggleBtn.classList.remove('active');
      sensorModeEl.textContent = '感測器: 已暫停';
      if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
    }

    toggleBtn.addEventListener('click', async () => {
      if (gyroActive) stopGyro();
      else await startGyro();
    });

    calBtn.addEventListener('click', async () => {
      if (!gyroActive) {
        const ok = await startGyro();
        if (!ok) return;
      }
      calSum = { a: 0, b: 0, g: 0 };
      calYaw = null;
      calStage = 1;
      calBanner.style.display = 'block';
      calBanner.textContent = '步驟 1/2：把手機固定在槍上，將槍【往右轉】約 30 度！';
    });

    // --- 3. 虛擬移動搖桿與快捷按鈕 ---
    const joyBase = document.getElementById('joy-base');
    const joyKnob = document.getElementById('joy-knob');
    let joyPointerId = null;
    let lastMoveSent = 0;

    function updateJoy(clientX, clientY) {
      const rect = joyBase.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const maxR = rect.width * 0.36;
      let dx = clientX - cx;
      let dy = clientY - cy;
      const dist = Math.hypot(dx, dy);
      if (dist > maxR) {
        dx = (dx / dist) * maxR;
        dy = (dy / dist) * maxR;
      }
      joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
      const now = performance.now();
      if (now - lastMoveSent >= 33) {
        lastMoveSent = now;
        const nx = (dx / maxR).toFixed(2);
        const ny = (-dy / maxR).toFixed(2);
        sendCmd(`MOVE:${nx},${ny}`);
      }
    }

    joyBase.addEventListener('pointerdown', (e) => {
      joyPointerId = e.pointerId;
      joyBase.setPointerCapture(e.pointerId);
      updateJoy(e.clientX, e.clientY);
    });
    joyBase.addEventListener('pointermove', (e) => {
      if (e.pointerId === joyPointerId) updateJoy(e.clientX, e.clientY);
    });
    function releaseJoy(e) {
      if (e.pointerId === joyPointerId) {
        joyPointerId = null;
        joyKnob.style.transform = 'translate(-50%, -50%)';
        sendCmd('MOVE:0,0');
      }
    }
    joyBase.addEventListener('pointerup', releaseJoy);
    joyBase.addEventListener('pointercancel', releaseJoy);

    document.querySelectorAll('.act-btn[data-cmd]').forEach(btn => {
      btn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        sendCmd(btn.dataset.cmd);
      });
    });

    clutchBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      isClutchHeld = true;
      pendingDx = 0;
      pendingDy = 0;
      clutchBtn.style.background = 'rgba(244, 63, 94, 0.45)';
      clutchBtn.textContent = '⏸ 已暫停瞄準';
    });
    function releaseClutch() {
      if (!isClutchHeld) return;
      isClutchHeld = false;
      virtualYaw = 0;
      pendingDx = 0;
      pendingDy = 0;
      clutchBtn.style.background = '';
      clutchBtn.textContent = '⏸ 按住移正';
    }
    clutchBtn.addEventListener('pointerup', releaseClutch);
    clutchBtn.addEventListener('pointercancel', releaseClutch);

    document.getElementById('center-btn').addEventListener('click', () => {
      pendingDx = 0;
      pendingDy = 0;
      virtualYaw = 0;
      lastOrient = null;
      sendCmd('GYRO_CENTER');
      telDeltaEl.textContent = '偏角:+0° (已歸零)';
    });
  </script>
</body>
</html>
